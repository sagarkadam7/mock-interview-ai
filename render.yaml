# Render Blueprint — https://render.com/docs/infrastructure-as-code
# New → Blueprint → connect this repo. Then set secret env vars in the dashboard
# (MONGO_URI, JWT_SECRET, GEMINI_API_KEY, FRONTEND_ORIGINS, REACT_APP_BACKEND_URL).

services:
  - type: web
    name: interviewai-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TOKEN_IN_BODY
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://interviewai-web-h2ht.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq

  - type: web
    name: interviewai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
